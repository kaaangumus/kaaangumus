<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Kaan Gümüş — Penetration Tester, Red Teamer">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#05070d" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070d" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <path d="M0 0 H1200 V150 C1010 188 830 126 620 154 C420 180 210 140 0 168 Z" fill="url(#wave)"/>
  <path d="M0 0 H1200 V150 C1010 188 830 126 620 154 C420 180 210 140 0 168 Z" fill="url(#fade)"/>

  <text x="600" y="104" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="56" font-weight="700" fill="#ffffff" filter="url(#soft)" opacity="0.35">Kaan Gümüş</text>
  <text x="600" y="104" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="56" font-weight="700" fill="#ffffff">Kaan Gümüş</text>
  <text x="600" y="142" text-anchor="middle"
        font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace"
        font-size="17" letter-spacing="2" fill="#e6edf3" opacity="0.92">PENETRATION TESTER · RED TEAMER</text>
</svg>
